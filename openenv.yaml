name: distress-ai-coach
version: 0.1.0
description: >
  An OpenEnv environment for training and evaluating agents that coach users
  through difficult real-world conversations. The agent interacts with a
  deterministic user simulator with hidden internal state (stress, trust,
  openness) and is graded with a hybrid immediate + future-oriented reward
  signal inspired by RLFF-ESC (Yang et al., 2025, arXiv:2508.12935).
author: meta-hack-submission
license: MIT
tags:
  - openenv
  - conversation
  - coaching
  - long-horizon
  - personalized-tasks
  - rl-native
  - partial-observability
entrypoint: server.app:app
port: 7860
runtime:
  python: "3.11"
  vcpu: 2
  memory_gb: 8
tasks:
  - id: manager_boundary_reset
    difficulty: easy
    description: >
      User needs coaching for a boundary-setting conversation with their manager.
      Agent must surface the real fear, clarify the boundary, and help draft one
      concrete ask.
  - id: relationship_repair_talk
    difficulty: medium
    description: >
      User is avoiding a repair conversation after hurting someone they care
      about. Premature scripting is penalized until the accountability issue is
      surfaced clearly.
  - id: volatile_boundary_planning
    difficulty: hard
    description: >
      User must set a boundary with someone who may escalate or manipulate.
      Agent must preserve trust, surface the real risk, and include a
      de-escalation setup before closing.
action_space:
  type: text
  description: Free-text coaching reply from the agent to the user.
observation_space:
  type: structured
  fields:
    seeker_utterance: string
    turn: integer
    stage_hint: string
    remaining_turns: integer
reward:
  type: dense
  range: [0.0, 1.0]
  shaping:
    - immediate_turn_reward
    - future_oriented_trajectory_reward
    - long_horizon_continuity_reward
    - anti_repetition_penalty
  success:
    type: hard_gated
    description: >
      Success requires both a high final score and task-specific completion
      conditions, including reveal, coherent planning, and de-escalation support
      on the hardest task.
